name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/install-xcodegen.sh
      - run: make check
      - run: make XB_FLAGS=CODE_SIGNING_ALLOWED=NO
