name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/install-xcodegen.sh
      - run: make check
      - run: make XB_FLAGS=CODE_SIGNING_ALLOWED=NO
